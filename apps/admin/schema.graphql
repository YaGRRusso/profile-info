type Query {
  dashboard: DashboardEntity!
  findManyApiTokenById(apiTokenIds: [ID!]!): [ApiTokenEntity!]!
  findManyApiTokens(apiTokenFilters: FilterApiTokenInput, apiTokenPagination: PaginationInput, apiTokenSort: SortApiTokenInput): PaginatedApiTokenEntity!
  findManyCourseById(courseIds: [ID!]!): [CourseEntity!]!
  findManyCourses(courseFilters: FilterCourseInput, coursePagination: PaginationInput, courseSort: SortCourseInput): PaginatedCourseEntity!
  findManyEducationById(educationIds: [ID!]!): [EducationEntity!]!
  findManyEducations(educationFilters: FilterEducationInput, educationPagination: PaginationInput, educationSort: SortEducationInput): PaginatedEducationEntity!
  findManyExperienceById(experienceIds: [ID!]!): [ExperienceEntity!]!
  findManyExperiences(experienceFilters: FilterExperienceInput, experiencePagination: PaginationInput, experienceSort: SortExperienceInput): PaginatedExperienceEntity!
  findManyOrganizationById(organizationIds: [ID!]!): [OrganizationEntity!]!
  findManyOrganizations(organizationFilters: FilterOrganizationInput, organizationPagination: PaginationInput, organizationSort: SortOrganizationInput): PaginatedOrganizationEntity!
  findManyProjectById(projectIds: [ID!]!): [ProjectEntity!]!
  findManyProjects(projectFilters: FilterProjectInput, projectPagination: PaginationInput, projectSort: SortProjectInput): PaginatedProjectEntity!
  findManySkillById(skillIds: [ID!]!): [SkillEntity!]!
  findManySkills(skillFilters: FilterSkillInput, skillPagination: PaginationInput, skillSort: SortSkillInput): PaginatedSkillEntity!
  findManyUserById(userIds: [ID!]!): [UserEntity!]!
  findManyUsers(userFilters: FilterUserInput, userPagination: PaginationInput, userSort: SortUserInput): PaginatedUserEntity!
  findOneApiToken(apiTokenFilters: FilterApiTokenInput): ApiTokenEntity!
  findOneApiTokenById(apiTokenId: ID!): ApiTokenEntity!
  findOneCourse(courseFilters: FilterCourseInput): CourseEntity!
  findOneCourseById(courseId: ID!): CourseEntity!
  findOneEducation(educationFilters: FilterEducationInput): EducationEntity!
  findOneEducationById(educationId: ID!): EducationEntity!
  findOneExperience(experienceFilters: FilterExperienceInput): ExperienceEntity!
  findOneExperienceById(experienceId: ID!): ExperienceEntity!
  findOneOrganization(organizationFilters: FilterOrganizationInput): OrganizationEntity!
  findOneOrganizationById(organizationId: ID!): OrganizationEntity!
  findOneProject(projectFilters: FilterProjectInput): ProjectEntity!
  findOneProjectById(projectId: ID!): ProjectEntity!
  findOneSkill(skillFilters: FilterSkillInput): SkillEntity!
  findOneSkillById(skillId: ID!): SkillEntity!
  findOneUser(userFilters: FilterUserInput): UserEntity!
  findOneUserById(userId: ID!): UserEntity!
  getMe: UserEntity!
}

