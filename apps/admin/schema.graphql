  createOneUser(createUserInput: CreateUserInput!): UserEntity!
  removeManyApiTokens(apiTokenIds: [ID!]!): BatchEntity!
  removeManyCourses(courseIds: [ID!]!): BatchEntity!
  removeManyEducations(educationIds: [ID!]!): BatchEntity!
  removeManyExperiences(experienceIds: [ID!]!): BatchEntity!
  removeManyOrganizations(organizationIds: [ID!]!): BatchEntity!
  removeManyProjects(projectIds: [ID!]!): BatchEntity!
  removeManySkills(skillIds: [ID!]!): BatchEntity!
  removeManyUsers(userIds: [ID!]!): BatchEntity!
  removeOneApiToken(apiTokenId: ID!): ApiTokenEntity!
  removeOneCourse(courseId: ID!): CourseEntity!
  removeOneEducation(educationId: ID!): EducationEntity!
  removeOneExperience(experienceId: ID!): ExperienceEntity!
  removeOneOrganization(organizationId: ID!): OrganizationEntity!
  removeOneProject(projectId: ID!): ProjectEntity!
  removeOneSkill(skillId: ID!): SkillEntity!
  removeOneUser(userId: ID!): UserEntity!
  signIn(signInInput: SignInInput!): String!
  summarize(summarizeInput: SummarizeInput!): AiEntity!
  translate(translateInput: TranslateInput!): AiEntity!
  updateManyApiTokens(apiTokenIds: [ID!]!, updateApiTokenInput: UpdateApiTokenInput!): BatchEntity!
  updateManyCourses(courseIds: [ID!]!, updateCourseInput: UpdateCourseInput!): BatchEntity!
  updateManyEducations(educationIds: [ID!]!, updateEducationInput: UpdateEducationInput!): BatchEntity!
  updateManyExperiences(experienceIds: [ID!]!, updateExperienceInput: UpdateExperienceInput!): BatchEntity!
  updateManyOrganizations(organizationIds: [ID!]!, updateOrganizationInput: UpdateOrganizationInput!): BatchEntity!
  updateManyProjects(projectIds: [ID!]!, updateProjectInput: UpdateProjectInput!): BatchEntity!
  updateManySkills(skillIds: [ID!]!, updateSkillInput: UpdateSkillInput!): BatchEntity!
  updateManyUsers(updateUserInput: UpdateUserInput!, userIds: [ID!]!): BatchEntity!
  updateMe(updateMeInput: UpdateMeInput!): UserEntity!
  updateOneApiToken(apiTokenId: ID!, updateApiTokenInput: UpdateApiTokenInput!): ApiTokenEntity!
  updateOneCourse(courseId: ID!, updateCourseInput: UpdateCourseInput!): CourseEntity!
  updateOneEducation(educationId: ID!, updateEducationInput: UpdateEducationInput!): EducationEntity!
